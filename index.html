<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <meta name="author" content="Taylor Sampson">

        <link rel="stylesheet" href="https://use.typekit.net/opp0vrn.css">
        <link rel="stylesheet" href="./Type/Avenir/avenir.css">
        <link rel="stylesheet" href="./css/styles.css">
        <link rel="stylesheet" href="./css/type_selector.css">
        <link rel="stylesheet" href="./css/type_variation.css">
    </head>
    <body>
        <div id="typeWrapper">
            <h1 class="primaryWord">
                <span class="phraseContainer">
                    <span class="word space stackingSpace">
                        <span>t</span><span>h</span><span>i</span><span class="lastLetter">s</span>
                    </span>

                    <span class="word space">
                        <span class="firstLetter">t</span><span>y</span><span>p</span><span class="lastLetter">e</span>
                    </span>
                </span>

                <span class="phraseContainer">
                    <span class="word space stackingSpace">
                        <span class="firstLetter">i</span><span class="lastLetter">s</span>
                    </span>

                    <span class="word">
                        <span class="firstLetter">v</span><span>a</span><span>r</span><span>i</span><span>a</span><span>b</span><span>l</span><span>e</span>  
                    </span>
                </span>
            </h1>
            <div class="scrollContainer">
                <p id="startingLine">Typeface:</p>
                <ul class="scroller">
                    <li class="typeEntry">Pressato</li>
                    <li class="typeEntry">Cheee</li>
                    <li class="typeEntry">Firelli</li>
                    <li class="typeEntry">Loretta</li>
                    <li class="typeEntry">Meursault</li>
                    <li class="typeEntry">Early Sans</li>
                    <li class="typeEntry">Scatterplot</li>
                </ul>
            </div>
        </div>
        <script src="./js/hover.js"></script>
        <script src="./js/typeChange.js"></script>
    </body>
</html>
